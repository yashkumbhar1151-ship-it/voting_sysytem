<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siddhant College Of Engineering</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;

        }

        header {
            text-align: center;
            background-color: #333;
            color: #fff;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        main {
            flex: 1;
            text-align: center;
            padding: 10% 10%;
        }

        #heading {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 25px;

        }

        #subheading {
            font-size: 18px;
            color: #333;
        }

        a {
            text-decoration: none;
            color: #333;
        }

        button {
            background-color: #333;
            color: #fff;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 10px;
        }

        button:hover {
            background-color: #555;
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
            margin-top: 1rem;
        }

        footer p:last-child {
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div>
        <header>
            <h1>SIDDHANT COLLEGE OF ENGINEERING</h1>
        </header>
            <main>
                <p id="heading">Welcome to our SCOE online voting system. <br><hr></p>
                <p id="subheading">Vote Your Favourite Candidate.</p>
                <a href="routes/VoterRegister.html"><button id="votenow">Voter - Register & Vote</button></a>
                <a href="routes/AdminLogin.html"><button id="adminbtn">Admin</button></a>
            </main>
        <footer>
            <p>&copy; 2026 Siddhant College Of Engineering. All rights reserved.</p>
            <p>Developed by: Sachin Bijapur and Yash Khumbar</p>
        </footer>
    </div>
</body>
</html>
