<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOE Voting - Registration</title>
    <link rel="stylesheet" href="../css/brand.css">
</head>
<body>
    <header class="brand-header">
        <div class="brand-container">
            <img src="../images and logo/logoSCOE.png" alt="SCOE Logo" class="brand-logo">
            <div class="brand-text">
                <h1>Siddhant College of Engineering</h1>
                <p>Online Voting System</p>
            </div>
        </div>
    </header>

    <div class="page-wrapper">
        <h2>Registration</h2>
        <form action="../api/register.php" method="post" enctype="multipart/form-data">
            <input type="text" name="name" placeholder="Name" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="cpassword" placeholder="Confirm password" required>
            <div style="margin-bottom:15px;">
                <label style="font-size:14px; color:#555; margin-bottom:6px; display:block;"><b>Upload Photo:</b></label>
                <input type="file" name="photo" accept="image/*">
            </div>
            <select name="role" required>
                <option value="" disabled selected>Select your role</option>
                <option value="1">Voter</option>
                <option value="2">Candidate</option>
            </select>
            <button id="Registerbtn" type="submit">Register</button>
            <div id="Redirect">
                Already registered? <a href="../index.html">Vote Now</a>
            </div>
        </form>
    </div>

    <footer class="brand-footer">
        <p>&copy; 2026 Siddhant College of Engineering &middot; Powered by Student Council</p>
    </footer>
</body>
</html>
