<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System - Voter Registration</title>
    <link rel="stylesheet" href="../css/Register.css">
    <style>
        .note {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .note strong {
            color: #343a40;
        }
    </style>
</head>
<body>
    <div id="RegisterHeader">
        <h1>Online Voting System</h1>
    </div>
    <hr>
    <h3 style="text-align: center;">Voter Registration</h3>
    <p class="note">No password needed. Register with your <strong>division roll no</strong> and <strong>appar id</strong> to vote <strong>once</strong>.</p>
    <form action="../api/voter_register.php" method="post">
            <input type="text" name="name" placeholder="Username" required><br>
        <input type="text" name="div_roll_no" placeholder="Division - Roll No (e.g. A-12)" required><br>
        <input type="text" name="appar_id" placeholder="Appar ID (Admission No)" required><br>
        <button id="Registerbtn">Register</button><br>
        <div id="Redirect">
            Voter already registered?<a href="../index.html">Vote Now</a>
        </div>
    </form>
</body>
</html>
